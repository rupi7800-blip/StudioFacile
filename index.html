<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudioFacile</title>
  <meta name="description" content="StudioFacile — passa gli esami in tranquillità con 30 minuti al giorno.">
  <meta name="theme-color" content="#1f4d41">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudioFacile">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/logo.svg" alt="" width="34" height="34">
      <div><span class="brand-name">Studio<em>Facile</em></span><span class="brand-sub" id="brand-sub"></span></div>
    </div>
    <div class="top-act" data-update-slot><span data-ponte-slot></span></div>
  </header>

  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sezioni"></nav>

  <div id="player" hidden></div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/ponte.js"></script>
  <script src="js/app.js"></script>
  <script src="js/aggiornamenti.js" data-version="1.1.0"></script>
</body>
</html>
